<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listen</title>
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="icon" href="./web/icons/listen-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="./web/icons/listen-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="./web/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Listen" />
    <meta name="theme-color" content="#111827" />
    <script>
      (() => {
        const key = "listen-theme-preference";
        const readPreference = () => {
          try {
            return window.localStorage?.getItem(key) ?? null;
          } catch {
            return null;
          }
        };
        const prefersDark = () => {
          try {
            return typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            return false;
          }
        };
        const preference = readPreference();
        const theme = preference === "light" || preference === "dark" || preference === "system" ? preference : "system";
        const resolved = theme === "system" ? (prefersDark() ? "dark" : "light") : theme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.resolvedTheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./web/main.tsx"></script>
  </body>
</html>
