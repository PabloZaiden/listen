name: Binary Release

on:
  release:
    types: [published]

jobs:
  binaries:
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@1e73c9a4b84bb2282d5a6fd8463f9a9f62c26c67 # installer v0.1.0
    permissions:
      contents: write
    with:
      prebuild_command: bun run build
      binaries: |
        [
          {
            "name": "listen",
            "asset_prefix": "listen",
            "build_command": "bun src/build.ts --target=$BUN_TARGET",
            "output_path": "dist/listen-$RELEASE_TARGET"
          }
        ]
