name: Binary Release

on:
  release:
    types: [published]

jobs:
  binaries:
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@b47bdc7e7721c12c9b6b8e5e0a97c045bf526a9b # installer v0.2.0
    permissions:
      contents: write
    with:
      prebuild_command: bun run build
      binaries: |
        [
          {
            "name": "listen",
            "asset_prefix": "listen",
            "build_command": "bun src/build.ts --target=$BUN_TARGET",
            "output_path": "dist/listen-$RELEASE_TARGET"
          }
        ]
