name: Binary Release

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  binaries:
    if: github.event_name != 'release' || github.event.release.tag_name != 'latest'
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@d142bb0f31e72a803d3d7ff982843ffbd3ae9506
    permissions:
      contents: write
    with:
      release_channel: ${{ github.event_name == 'push' && 'latest' || 'stable' }}
      prebuild_command: bun run tsc && bun run build
      binaries: |
        [
          {
            "name": "listen",
            "asset_prefix": "listen",
            "build_command": "bun src/build.ts --target=$BUN_TARGET",
            "output_path": "dist/listen-$RELEASE_TARGET"
          }
        ]
