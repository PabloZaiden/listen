name: Binary Release

on:
  release:
    types: [published]

jobs:
  binaries:
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@d65a93c1af0d7ce62524d6ccdfee44d0f6ceac4e # installer v0.0.7
    permissions:
      contents: write
    with:
      prebuild_command: bun run build
      binaries: |
        [
          {
            "name": "listen",
            "asset_prefix": "listen",
            "build_command": "bun src/build.ts --target=$BUN_TARGET",
            "output_path": "dist/listen-$RELEASE_TARGET"
          }
        ]
