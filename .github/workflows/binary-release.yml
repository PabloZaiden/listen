name: Binary Release

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  binaries:
    if: github.event_name != 'release' || github.event.release.tag_name != 'latest'
    uses: pablozaiden/installer/.github/workflows/reusable-binary-release.yml@bd5fa6697c003e620d8d7b92734aea506f31e3fa
    permissions:
      contents: write
    with:
      release_channel: ${{ github.event_name == 'push' && 'latest' || 'stable' }}
      prebuild_command: bun run tsc && bun run build
      targets: |
        [
          {"os":"ubuntu-latest","target":"linux-x64","bun_target":"bun-linux-x64"},
          {"os":"ubuntu-latest","target":"linux-arm64","bun_target":"bun-linux-arm64"},
          {"os":"macos-latest","target":"darwin-x64","bun_target":"bun-darwin-x64"},
          {"os":"macos-latest","target":"darwin-arm64","bun_target":"bun-darwin-arm64"}
        ]
      binaries: |
        [
          {
            "name": "listen",
            "asset_prefix": "listen",
            "build_command": "bun src/build.ts --target=$BUN_TARGET",
            "output_path": "dist/listen-$RELEASE_TARGET"
          }
        ]
