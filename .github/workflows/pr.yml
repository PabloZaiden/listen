name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run tsc
      - run: docker build -t listen-pr-smoke .
      - run: LISTEN_TEST_IMAGE=listen-pr-smoke bun run test
      - name: Development web/PWA smoke
        run: |
          mkdir -p .cache/ci-dev
          LISTEN_DATA_DIR=./.cache/ci-dev LISTEN_HOST=localhost LISTEN_PORT=3018 bun run dev &
          PID=$!
          trap 'kill "$PID"' EXIT
          LISTEN_BASE_URL=http://localhost:3018 bun scripts/smoke-web.ts
